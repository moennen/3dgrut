type: colmap
downsample_factor: 1
test_split_interval: 8
# Match GSplat's camera/point similarity transform before splitting the dataset.
normalize_world_space: false
# Match GSplat's sorted image mapping, rounded bicubic PNG cache, and intrinsic correction.
gsplat_image_downscale: false
camera_names: null  # Optional folder-name filter, e.g. [front_stereo_camera_left]
camera_ids: null    # Optional COLMAP numeric camera id filter, e.g. [2]
load_exif: true  # Load EXIF exposure data from JPEG images for post-processing
# Load ground-truth geometry from <path>/depths and <path>/normals for evaluation.
# Off by default: most COLMAP scenes have none, and reading it costs time per frame.
load_depth_gt: false
load_normal_gt: false

# Monocular pseudo-depth prior, for loss.use_pseudo_depth_order. Predicted from the images
# alone by a foundation model, so it is independent of load_depth_gt above -- that ground truth
# stays reserved for evaluation and the training split never reads it.
pseudo_depth:
  # Enabled by the loss, not here: this only says where the prior comes from. Set by the
  # trainer, which turns it on for the training split when the loss needs it.
  enabled: false
  # Which inference stack loads the model, and with it *what the prediction means*:
  #   transformers      - Depth Anything V2 via AutoModelForDepthEstimation. Emits disparity
  #                       (larger is nearer). Apache-2.0, hence the default.
  #   depth_anything_3  - Depth Anything 3 via the upstream `depth_anything_3` package, which
  #                       must be importable. Emits *depth* (larger is farther), the opposite
  #                       convention. DA3MONO-LARGE is Apache-2.0 too; this is not the default
  #                       only because it needs that package, which the venv does not carry.
  # The backend fixes the quantity, so no config can pair a model with the wrong sign.
  backend: transformers
  # Model id for that backend. The cache directory embeds the backend, this id and the resulting
  # quantity, so changing any of them cannot silently reuse the previous model's predictions.
  # For depth_anything_3, use e.g. depth-anything/DA3MONO-LARGE.
  model: depth-anything/Depth-Anything-V2-Base-hf
  # Where to keep predictions. null puts them under <path>/pseudo_depth_cache, which needs the
  # scene directory to be writable; point this elsewhere for a read-only dataset.
  cache_dir: null
  # Fit one affine per frame taking the prior into scene z, against the COLMAP sparse points the
  # scene was initialised from. Only a *regression* loss needs this; the ordinal loss reads the
  # prior's ordering and is invariant to the transform. Enabled by the loss, like `enabled`.
  # Requires a depth backend -- a disparity prior is affine to inverse z, so this would fit the
  # wrong thing, and the dataset raises rather than allow it.
  align_to_sparse_points: false
