defaults:
  - _self_
  - /strategy: gs
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

path: ???
seed_initialization: 42  # seed for rng in model initialization
experiment_name: ""
resume: ""
out_dir: "./runs"
n_iterations: 30000
with_gui: false
with_viser_gui: false
gui_update_from_device: true
val_frequency: 5000
num_workers: 24
use_wandb: false
wandb_project: "3dgrt"
test_last: true
validate_first: false
log_frequency: 1
compute_extra_metrics: true

enable_frame_timings: false

enable_writer: true
writer:
  hit_stat_frequency: 999999
  max_num_hits: 128
  log_image_views: ${int_list:[ 0, 13, 27, 43, 78 ]}

export_ply:
  enabled: false
  path: ""
import_ply:
  enabled: false
  path: ""
  init_global_step: 0
  
export_usd:
  enabled: false
  path: ""
  apply_normalizing_transform: true
  format: standard  # "nurec" for internal USDVol format, "standard" for USDVol ParticleField3DGaussianSplat
  half_precision: false
  export_cameras: true
  export_background: true
  # zDepth | cameraDistance | rayHitDistance
  sorting_mode_hint: cameraDistance
  # Enable post-processing export when the checkpoint contains a supported module.
  # Defaults to true; ppisp-integration-mode controls how PPISP is exported.
  export_post_processing: true
  # spg-runtime authors PPISP as Omniverse SPG shaders applied at render time.
  # sh-optimized folds one fixed PPISP transform into Gaussian SH coefficients.
  # spg-runtime | sh-optimized
  ppisp-integration-mode: spg-runtime
  # Optional fixed PPISP camera/frame. sh-optimized defaults unset values to 0;
  # spg-runtime keeps dynamic per-camera/per-frame behavior when unset.
  ppisp-reference-camera-id: null
  ppisp-reference-frame-id: null
  # Achromatic PPISP responsivity default authored on spg-runtime SPG shaders.
  # To rescale asset radiance by k while preserving the PPISP input magnitude,
  # set scene-radiance-scale: k and ppisp-responsivity: 1/k.
  ppisp-responsivity: 1.0
  # null = auto-export controllers when the PPISP checkpoint has them.
  # true = require controller export; false = force static/time-sampled fallback.
  enable-ppisp-controller-export: null
  # Number of optimizer steps for sh-optimized export. null uses the default (3000).
  sh-optimization-num-iterations: null
  # Multiplicative scale applied to exported SH radiance.
  scene-radiance-scale: 1.0
  # USD timeCodesPerSecond; time codes are bare frame indices so this sets playback speed
  frames_per_second: 1.0

model:
  density_activation: sigmoid
  scale_activation: exp
  default_density: 0.1
  default_scale_factor: 1.0
  optimize_density: true
  optimize_features_albedo: true
  optimize_features_specular: true
  optimize_features: true
  optimize_position: true
  optimize_rotation: true
  optimize_scale: true
  bvh_update_frequency: 1
  feature_type: "sh" # one of [sh, nht] # sh: spherical harmonics radiance, nht: neural harmonics texture
  progressive_training:
    init_n_features: 0 # sh: initial sh deg | mlp: num of dims initially unmasked
    max_n_features: 3 # sh: maximum sh deg | mlp: total num of dims finally unmasked
    increase_frequency: 1000 # unmask more feature dimensions every N global steps
    increase_step: 1 # sh: how many degrees unmasked per step | mlp: how many dims unmasked per step

  nht_features:
    dim: 48
    init_min: -1.5707963267948966
    init_max: 1.5707963267948966
    activation:
      type: "sincos"
      num_frequencies: 1
    interpolation_type: "barycentric"

  nht_decoder:
    enabled: true
    hidden_dim: 128
    num_layers: 3
    dir_encoding: "SphericalHarmonics"
    dir_encoding_degree: 3
    sh_scale: 3.0
    center_ray_encoding: false
    output_activation: "Sigmoid"
    unpremultiply_alpha: false
    image_feature_dim: 0  # Frozen image-feature target dimension; 0 disables the feature head.
    learning_rate: 0.00068
    reg_weight: 0.0
    scheduler:
      type: "cosine"
      decay_final: 0.1
      max_steps: 30000
    ema_decay: 0.95
    ema_start_step: 0
    color_refine_steps: 3000

  background:
    name: background-color # one of [skip-background, background-color]
    color: black # one of [black, white, random] needs to be defined if name == background-color

  print_stats: true

checkpoint:
  iterations: ${int_list:[ 7000, 30000 ]}

optimizer:
  type: adam # We only support adam and selective_adam for now
  lr: 0.0
  eps: 1.e-15
  params:
    positions:
      lr: 0.00016 # 3DGS value: 0.00016 initial and decayed to 0.0000016
    density:
      lr: 0.05 # 3DGS value: 0.05
    features_albedo:
      lr: 0.0025 # 3DGS value: 0.0025
    features_specular:
      lr: ${div:${optimizer.params.features_albedo.lr},20} # 3DGS value 20x smaller than lr of features_albedo
    features:
      lr: 0.015
    rotation:
      lr: 0.001 # 3DGS value: 0.001
    scale:
      lr: 0.005 # 3DGS value: 0.005

scheduler:
  positions:
    # In the 3DGS paper they additionally have a parameter lr_delay_mult, but is is not being used so I drop it here
    type: exp
    lr_init: ${optimizer.params.positions.lr}
    lr_final: 0.0000016

    max_steps: 30000

  density:
    type: skip

  features:
    type: cosine
    decay_final: 0.1
    max_steps: 30000

loss:
  use_l1: true
  lambda_l1: 0.8
  
  use_l2: false
  lambda_l2: 1.0

  use_ssim: true
  lambda_ssim: 0.2

  use_opacity: false
  lambda_opacity: 0.0

  # Penalises all three axes, so it shrinks particles rather than flattening them. For
  # flatness use use_scale_flatten below; the two pull in different directions.
  use_scale: false
  lambda_scale: 0.0

  # Penalises each particle's z scale -- the axis the rendered normal actually follows --
  # collapsing an ellipsoid towards the disk a surfel already is, while leaving x and y free.
  # Must be z rather than min(scale): the normal is the local z axis regardless of which axis
  # is shortest, so penalising the shortest one flattens along a direction the normal ignores
  # and measured ~30 degrees worse than no regularisation at all. See test_normal_axis.py.
  # Normalised by the scene extent, so one lambda transfers between scenes. Rejected for
  # trisurfel, whose kernel already forces scale.z.
  use_scale_flatten: false
  # 1.0 measured on OB3D at 7k: this is the knee, reaching z/xy 0.04 with nothing above it
  # moving normals more than 0.3 degrees. Improves normals 8-16 degrees, reproducing the surfel
  # primitive's normal quality on ellipsoids, and combined with use_depth_normal gives the best
  # normals measured. Not free: it also converges *PSNR* onto the surfel's, costing 0.22 dB on
  # sponza (4 sigma over 4 seeds). Mildly worsens depth on its own.
  lambda_scale_flatten: 1.0

  # Depth-normal consistency. Needs render.enable_normals, and under 3DGRT a backward pipeline
  # that differentiates the normal buffer (render.pipeline_type=referenceSlang); the tracer
  # rejects the combination rather than training on zero normal gradients.
  use_depth_normal: false
  # 0.05 measured on OB3D at 7k: normals beat the view-direction control by 9-19 degrees and
  # depth abs_rel improves up to 20%, for 0.1-0.5 PSNR and ~15% throughput. Normal accuracy
  # plateaus above this while PSNR keeps falling. Prefer 0.005 if appearance comes first.
  lambda_depth_normal: 0.05
  # Iteration the term switches on. Normals are meaningless until the geometry roughly settles.
  depth_normal_from_iter: 7000
  # Drops the steepest tail of the relative depth gradient, where an expected depth lands
  # between two surfaces at an occlusion boundary and describes neither. Measured worth
  # 1.5-2 degrees of target quality on OB3D, so a trim rather than a fix; null disables it.
  depth_normal_grad_percentile: 0.9

  # Depth variance along the ray: penalises rays whose compositing weight is spread over
  # distance rather than concentrated on a surface. Needs render.enable_depth_variance for the
  # second-moment buffer, and 3DGUT -- 3DGRT does not render it. The trainer rejects both
  # combinations rather than training on an empty buffer.
  #
  # Reduces to sum(w*t^2) - sum(w*t)^2/sum(w) per ray, normalised by the squared scene extent
  # so one lambda transfers between scenes. Note it penalises an un-normalized accumulator, so
  # the model can also reduce it by making the scene transparent; watch accumulated opacity.
  use_depth_variance: false
  lambda_depth_variance: 0.0
  # Divide by the squared expected depth: Var/mu^2, the squared coefficient of variation. Same
  # buffers and same render, but dimensionless, so it is scale-free rather than merely
  # extent-normalised (the absolute form scales as mu^2 within a scene, which is why no lambda
  # transferred between sponza and emerald-square). It is also invariant to uniform fading and
  # shifts the floater-locking barrier from 0.49 to 0.82. Lambda does not carry over between
  # the two forms. Off preserves the measured absolute form; see docs/normal-supervision.md.
  depth_variance_relative: false
  # Iteration the term switches on, matching use_depth_normal: before the geometry settles
  # every ray is diffuse and the term would fight the reconstruction rather than sharpen it.
  depth_variance_from_iter: 7000

  # Directional variance of the alpha-weighted normal distribution on each ray. A coherent
  # surface has zero cost; conflicting normals from overlapping layers approach one. It applies
  # to every primitive type, needs render.enable_normals, and is invariant to uniform fading.
  use_normal_variance: false
  lambda_normal_variance: 0.0
  normal_variance_from_iter: 7000

  # Ordinal supervision from a monocular pseudo-depth prior: penalises pixel pairs the render
  # orders opposite to the prior, and nothing else. Reads only the sign of the prior's
  # differences, so it is invariant to any increasing transform of it and needs no alignment.
  # Turns on dataset.pseudo_depth for the training split, which builds a cache on first use.
  #
  # The only geometry term here measured to improve depth on all of sponza, lone-monk and
  # emerald-square. It was built as the *anchor* the depth-variance term lacks -- variance says
  # "commit to a surface" without saying where -- and it does repair that term, but it is better
  # alone than paired with it, so prefer it on its own. See docs/normal-supervision.md.
  use_pseudo_depth_order: false
  # 0.1 measured on OB3D at 7k over 3 seeds: depth abs_rel improves 10-11% on sponza,
  # lone-monk *and* emerald-square, the first geometry term here to help all three. Costs
  # 0.2-0.6 dB PSNR on lone-monk and emerald and is free on sponza. 1.0 buys a little more
  # depth on lone-monk for 2.4 dB on emerald; 10 and above degrade both.
  lambda_pseudo_depth_order: 0.0
  # Pairs are drawn at a random offset of up to this fraction of the longer image side.
  pseudo_depth_shift_fraction: 0.05
  # Drop pairs whose prior disparity differs by less than this fraction of the map's
  # inter-quartile range. Off, because measurement contradicted the idea: gating is neutral on
  # sponza and lone-monk and costs emerald-square its entire gain (+0.7% vs -10.3% depth). A
  # large disparity gap is a long-range comparison, which is exactly where this prior drifts,
  # so the gate keeps its weakest structure and drops the local structure that is its best.
  # Retained only so the comparison stays runnable -- see docs/normal-supervision.md.
  pseudo_depth_gate: 0.0
  # Iteration the term switches on. Unlike the depth-normal and variance terms this one does
  # not need settled geometry -- it supplies coarse ordering, which is most useful early -- so
  # it defaults to being on from the start.
  pseudo_depth_from_iter: 0

  # Regression supervision from the same prior: L1 between the rendered ray distance and the
  # prior put into scene units by a per-frame affine fitted to the COLMAP sparse points. Needs
  # a *depth* prior (dataset.pseudo_depth.backend: depth_anything_3), because the alignment is
  # an affine in z and a disparity prior is affine to inverse z; it refuses rather than guess.
  # Turns on dataset.pseudo_depth.align_to_sparse_points as well as the cache.
  #
  # The largest depth effect measured in this repo: at lambda 0.1 over 3 seeds, depth `abs_rel`
  # falls 60% on lone-monk, 46% on emerald-square and 11% on sponza, and lone-monk's `delta1`
  # failure rate goes from 18.7% to 1.8%. PSNR costs -0.33 to +0.34 dB. lambda 1.0 costs
  # 1.1-2.4 dB and is worse on depth than 0.1 everywhere; 0.01 is better on emerald-square alone.
  #
  # It supersedes the ordinal term rather than complementing it -- running both adds nothing --
  # and it is off by default only because it needs the `depth_anything_3` package on PYTHONPATH.
  use_pseudo_depth_l1: false
  lambda_pseudo_depth_l1: 0.0
  # Iteration the term switches on. Like the ordinal term this supplies coarse placement rather
  # than sharpness, so it does not wait for settled geometry.
  pseudo_depth_l1_from_iter: 0
  use_image_features: false
  lambda_image_features: 0.0
  image_features_alpha_min: 0.05

# Post-processing configuration
post_processing:
  # null | "ppisp" | "linear-to-srgb"
  method: null
  # Enable the controller for predicting per-frame corrections for novel views.
  # When false, zero corrections are used for novel views.
  use_controller: true
  # Number of extra distillation steps after main training (only for "ppisp").
  # When > 0, enables distillation mode: Gaussians and PPISP params are frozen,
  # only the controller is trained for these additional steps.
  n_distillation_steps: 5000

hydra:
  output_subdir: null
  job:
    chdir: false
  run:
    dir: .
