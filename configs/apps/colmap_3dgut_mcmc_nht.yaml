# @package _global_
# NHT (Neural Harmonic Textures) variant for colmap datasets with 3DGUT and MCMC

defaults:
  - /base_mcmc
  - /dataset: colmap
  - /initialization: colmap
  - /render: 3dgut
  - _self_

model:
  feature_type: "nht"

# Match reference NHT loss: L1(0.9) + SSIM(0.1) (benchmark uses --ssim_lambda 0.1)
loss:
  use_l1: true
  lambda_l1: 0.9
  use_ssim: true
  lambda_ssim: 0.1
