# @package _global_
# NHT (Neural Harmonic Textures) variant for nerf_synthetic with 3DGUT and MCMC

defaults:
  - /base_mcmc
  - /dataset: nerf
  - /initialization: random
  - /render: 3dgut
  - _self_

model:
  feature_type: "nht"

# Match reference NHT regularization (neural-harmonic-textures/gsplat/examples/simple_trainer_nht.py)
loss:
  lambda_opacity: 0.02
  lambda_scale: 0.005
