method: 3dgrt # 3dgrt or 3dgut
  
pipeline_type: reference
backward_pipeline_type: ${render.pipeline_type}Bwd
particle_kernel_degree: 4
particle_kernel_density_clamping: true
particle_kernel_min_response: 0.0113
particle_kernel_min_alpha: ${div:1.0,255.0}
particle_kernel_max_alpha: 0.99
particle_radiance_sph_degree: 3
primitive_type: instances
min_transmittance: 0.001
max_consecutive_bvh_update: 15
# Renders the normal buffer. Every pipeline renders it, but only pipeline_type=referenceSlang
# differentiates it, so loss.use_depth_normal requires that pipeline and is rejected on the
# others; see NORMAL_GRADIENT_BACKWARD_PIPELINES in threedgrt_tracer/tracer.py.
enable_normals: false
# Renders the second moment of the hit distance, sum(w * t^2), which with the depth buffer's
# sum(w * t) gives the variance of the per-ray weight distribution. 3DGUT only -- 3DGRT does
# not implement it -- and differentiable there on all three backward paths, so
# loss.use_depth_variance can train against it. Left off by default: it costs a buffer and a
# per-hit multiply-add, and nothing reads it unless asked.
enable_depth_variance: false
enable_hitcounts: true
enable_kernel_timings: false
particle_feature_half: false
feature_output_half: false
