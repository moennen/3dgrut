[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depthrecall"
version = "0.1.0"
description = "Recall of ground-truth scan points against rendered depth maps"
requires-python = ">=3.9"
# Deliberately minimal: the point of this package is that any method's depth maps can be
# scored without installing that method's stack. numpy is the only hard requirement;
# every file format beyond .npy/.npz is an optional import resolved at load time.
dependencies = ["numpy"]

[project.optional-dependencies]
formats = ["opencv-python", "pillow"]
dev = ["pytest"]
surface = ["scipy", "open3d>=0.18.0"]

[project.scripts]
depthrecall = "depthrecall.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["depthrecall*"]

[tool.black]
target-version = ["py311"]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
# Also declared in the repo root's pyproject: without it, a run from the root classifies
# `depthrecall` as third-party and undoes what a run from here does.
known_first_party = ["depthrecall"]
